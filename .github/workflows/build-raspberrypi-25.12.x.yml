name: Build 25.12.x RaspBerryPi
on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: false
        default: "25.12.1"
        type: choice
        options:
          - 25.12.0
          - 25.12.1
      profile:
        type: choice
        description: "请选择树莓派型号"
        required: true
        options:
          - rpi-3
          - rpi-4
          - rpi-5
        default: rpi-4
      custom_router_ip:
        description: "请设置路由器的管理地址 格式:192.168.x.1 或 10.x.x.1"
        required: true
        default: "192.168.100.1"
      rootfs_partsize:
        description: '选择软件包空间大小'
        required: true
        type: choice
        default: '1G'
        options:
          - '1G'
          - '2G'
          - '3G'
          - '4G'
      enable_store:
        description: "集成 store 商店"
        required: false
        type: boolean
        default: false
      include_docker:
        description: |
          是否编译 Docker 插件
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'no'
        type: choice
        options:
        - 'yes'
        - 'no'
      pppoe_account:
        description: "宽带账号 (若启用PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/raspberrypi/25.12/build25.sh

      - name: Save Custom Router IP into OpenWrt files
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          echo "${{ github.event.inputs.custom_router_ip || '192.168.100.1' }}" > "${{ github.workspace }}/custom/custom_router_ip.txt"
          echo "您设置的树莓派管理地址是:${{ github.event.inputs.custom_router_ip || '192.168.100.1' }}"
          # 后续步骤会将该文件映射到路由器/etc/config/custom_router_ip.txt 以便用于开机脚本99-custom.sh读取用户设置的ip

      - name: Validate PPPoE Inputs
        run: |
          if [[ "${{ github.event.inputs.enable_pppoe || 'no' }}" == "yes" ]]; then
            if [[ -z "${{ github.event.inputs.pppoe_account }}" || -z "${{ github.event.inputs.pppoe_password }}" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi

      - name: Enable Store integration
        run: |
          if [ "${{ github.event.inputs.enable_store }}" == "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> shell/apk-custom-packages.sh
            echo "✅ 已追加 luci-app-store"
          else
            echo "❎ 未启用 luci-app-store"
          fi

      - name: Building RaspBerryPi ImmortalWrt 25.12.x
        run: |
          profile="${{ github.event.inputs.profile || 'rpi-4' }}"
          include_docker="${{ github.event.inputs.include_docker || 'no' }}"
          rootfs_partsize="${{ github.event.inputs.rootfs_partsize || '1G' }}"
          case "$rootfs_partsize" in
            1G)
              ROOTFS_SIZE=1024
              ;;
            2G)
              ROOTFS_SIZE=2048
              ;;
            3G)
              ROOTFS_SIZE=3072
              ;;
            4G)
              ROOTFS_SIZE=4096
              ;;
          esac
          echo "ROOTFS_SIZE=$ROOTFS_SIZE" >> $GITHUB_ENV
          luci_version="${{ github.event.inputs.luci_version || '25.12.1' }}"

          # 根据树莓派型号选择对应的 imagebuilder 镜像与目标子目录
          case "$profile" in
            rpi-3)
              tag=bcm27xx-bcm2710-openwrt-${luci_version}
              echo "platform=bcm27xx/bcm2710" >> $GITHUB_ENV
              ;;
            rpi-4)
              tag=bcm27xx-bcm2711-openwrt-${luci_version}
              echo "platform=bcm27xx/bcm2711" >> $GITHUB_ENV
              ;;
            rpi-5)
              tag=bcm27xx-bcm2712-openwrt-${luci_version}
              echo "platform=bcm27xx/bcm2712" >> $GITHUB_ENV
              ;;
            *)
              echo "Unsupported profile: $profile"
              exit 1
              ;;
          esac
          echo "Building for profile: $profile with image tag: $tag"

          docker run --rm -i \
              --user root \
              -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
              -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
              -v "${{ github.workspace }}/custom:/home/build/immortalwrt/files/etc/config" \
              -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
              -v "${{ github.workspace }}/raspberrypi/25.12/build25.sh:/home/build/immortalwrt/build.sh" \
              -e PROFILE=$profile \
              -e INCLUDE_DOCKER=$include_docker \
              -e ROOTFS_PARTSIZE=$ROOTFS_SIZE \
              -e ENABLE_PPPOE=${{ github.event.inputs.enable_pppoe || 'no' }} \
              -e PPPOE_ACCOUNT=${{ github.event.inputs.pppoe_account }} \
              -e PPPOE_PASSWORD=${{ github.event.inputs.pppoe_password }} \
          immortalwrt/imagebuilder:$tag /bin/bash /home/build/immortalwrt/build.sh

      - name: Create info
        if: github.event_name == 'workflow_dispatch'
        run: |
          cat > ${{ github.workspace }}/rpi-info.md <<EOF
          ## 🍓 树莓派固件信息

          - ✳️ **设备型号**: ${{ github.event.inputs.profile }}
          - 🏠 **后台地址**: ${{ github.event.inputs.custom_router_ip }}
          - 👤 **用户名**: root
          - 🔑 **密码**: 无
          EOF

          if [ "${{ github.event.inputs.include_docker }}" == "yes" ]; then
            extra_content="#### 默认带docker"
            echo -e "\n$extra_content" >> ${{ github.workspace }}/rpi-info.md
          else
            echo -e "\n#### 不带docker" >> ${{ github.workspace }}/rpi-info.md
          fi

      - name: Upload ImmortWrt as release assets
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Autobuild-raspberrypi-25.12
          name: ImmortWrt-RaspBerryPi-25.12
          body_path: ${{ github.workspace }}/rpi-info.md
          files: |
            ${{ github.workspace }}/bin/targets/${{ env.platform }}/*squashfs-factory.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
